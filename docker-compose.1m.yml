# 1M target for a Linux/WSL2 host with host networking.
# Do not start this until README-1M.md host limits are applied.
# Four clients x 250000 = 1000000. Each client uses four source addresses.
services:
  ws:
    build: .
    network_mode: host
    volumes:
      - ./logs:/app/logs
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: "8080"
      WS_TRANSPORT: "epoll"
      WS_ACCEPTORS: "2"
      WS_SO_REUSEPORT: "true"
      WS_WORKERS: "6"
      WS_MAX_CONNECTIONS: "1000020"
      WS_IDLE_SECONDS: "3600"
      #for normal we are using 8192, but for 1M test we need to increase it to 65536
      WS_BACKLOG: "65536"
      WS_SO_RCVBUF: "4096"
      WS_SO_SNDBUF: "4096"
      WS_MAX_FRAME_BYTES: "4096"
      WS_MAX_MESSAGE_BYTES: "4096"
      WS_HANDSHAKE_TIMEOUT_SECONDS: "60"
      JAVA_TOOL_OPTIONS: "-Xms12g -Xmx20g -XX:+UseZGC -XX:+ZGenerational -XX:MaxDirectMemorySize=3g -Xss256k -XX:+ExitOnOutOfMemoryError"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
  client-a:
    build:
      context: ./rust-client
    network_mode: host
    depends_on: [ws]
    environment:
      TARGET: ws://127.0.0.1:8080/ws
      CONNECTIONS: "250000"
      RAMP_PER_SECOND: "500"
      INITIAL_DELAY: "15"
      HOLD_SECONDS: "0"
      PING_SECONDS: "0"
      MESSAGE_BYTES: "0"
      REPORT_SECONDS: "10"
      WS_WORKERS: "2"
      LOCAL_ADDRESSES: "127.0.0.2,127.0.0.3,127.0.0.4,127.0.0.5,127.0.0.6,127.0.0.7,127.0.0.8,127.0.0.9"
      METRICS_PORT: "9101"
      WS_SO_RCVBUF: "4096"
      WS_SO_SNDBUF: "4096"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
  client-b:
    build:
      context: ./rust-client
    network_mode: host
    depends_on: [ws]
    environment:
      TARGET: ws://127.0.0.1:8080/ws
      CONNECTIONS: "250000"
      RAMP_PER_SECOND: "500"
      INITIAL_DELAY: "20"
      HOLD_SECONDS: "0"
      PING_SECONDS: "0"
      MESSAGE_BYTES: "0"
      REPORT_SECONDS: "10"
      WS_WORKERS: "2"
      LOCAL_ADDRESSES: "127.0.0.10,127.0.0.11,127.0.0.12,127.0.0.13,127.0.0.14,127.0.0.15,127.0.0.16,127.0.0.17"
      METRICS_PORT: "9102"
      WS_SO_RCVBUF: "4096"
      WS_SO_SNDBUF: "4096"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
  client-c:
    build:
      context: ./rust-client
    network_mode: host
    depends_on: [ws]
    environment:
      TARGET: ws://127.0.0.1:8080/ws
      CONNECTIONS: "250000"
      RAMP_PER_SECOND: "500"
      INITIAL_DELAY: "25"
      HOLD_SECONDS: "0"
      PING_SECONDS: "0"
      MESSAGE_BYTES: "0"
      REPORT_SECONDS: "10"
      WS_WORKERS: "2"
      LOCAL_ADDRESSES: "127.0.0.18,127.0.0.19,127.0.0.20,127.0.0.21,127.0.0.22,127.0.0.23,127.0.0.24,127.0.0.25"
      METRICS_PORT: "9103"
